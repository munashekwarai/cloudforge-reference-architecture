services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    secrets: [tls_certificate, tls_private_key]
    networks: [public, application]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O- https://127.0.0.1:8443/proxy-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on: {app: {condition: service_healthy}}
  app:
    build: ./app
    environment:
      DB_HOST: database
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/db_password
      LOG_LEVEL: INFO
    secrets: [db_password]
    networks: [application, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: app
      POSTGRES_DB: app
    secrets: [db_password]
    networks: [data]
    volumes: [db_data:/var/lib/postgresql/data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 3s
      retries: 10
  backup:
    image: postgres:16-alpine
    profiles: [operations]
    environment: {PGHOST: database, PGUSER: app, PGDATABASE: app, PGPASSFILE: /run/secrets/pgpass}
    secrets: [pgpass]
    networks: [data]
    volumes: [backups:/backups]
    entrypoint: ["sh", "-c"]
    command: ["umask 077; pg_dump -Fc -f /backups/app-$$(date +%Y%m%dT%H%M%S).dump"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
networks:
  public: {}
  application: {internal: true}
  data: {internal: true}
secrets:
  db_password: {file: ./.secrets/db_password}
  tls_certificate: {file: ./.secrets/tls.crt}
  tls_private_key: {file: ./.secrets/tls.key}
  pgpass: {file: ./.secrets/pgpass}
volumes:
  db_data: {}
  backups: {}
